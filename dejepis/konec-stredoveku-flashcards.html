<!DOCTYPE html>
<html lang="cs">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Flash Cards - Konec středověku a počátky novověku</title>
    <style>
      :root {
        color-scheme: light;
        font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
        line-height: 1.5;
        --surface: #ffffff;
        --surface-soft: #fef3c7;
        --surface-strong: #fbbf24;
        --ink: #1f2937;
        --ink-soft: #4b5563;
        --accent: #7c3aed;
        --accent-dark: #5b21b6;
        --teacher: #b45309;
        --teacher-bg: #fef3c7;
        --textbook: #6d28d9;
        --textbook-bg: #ede9fe;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 0 1.5rem 3rem;
        background: linear-gradient(135deg, #fef3c7 0%, #c4b5fd 100%);
        color: var(--ink);
        min-height: 100vh;
      }

      main {
        max-width: 900px;
        margin: 0 auto;
      }

      header {
        text-align: center;
        padding: 2.5rem 0 2rem;
      }

      header h1 {
        margin: 0 0 0.75rem;
        font-size: clamp(1.6rem, 4.5vw, 2.25rem);
        line-height: 1.2;
      }

      header p {
        margin: 0 auto 1.5rem;
        max-width: 60ch;
        color: var(--ink-soft);
      }

      .controls {
        background: var(--surface);
        border-radius: 16px;
        padding: 1.5rem 2rem;
        margin-bottom: 2rem;
        box-shadow: 0 12px 30px rgba(124, 58, 237, 0.15);
        border: 1px solid rgba(124, 58, 237, 0.14);
      }

      .controls h3 {
        margin: 0 0 1rem;
        font-size: 1.15rem;
      }

      .filter-group {
        margin-bottom: 1.25rem;
      }

      .filter-group label {
        display: block;
        font-weight: 600;
        margin-bottom: 0.5rem;
        font-size: 0.95rem;
      }

      .checkbox-group {
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem;
      }

      .checkbox-group label {
        display: flex;
        align-items: center;
        gap: 0.4rem;
        font-weight: normal;
        cursor: pointer;
        background: var(--surface-soft);
        padding: 0.5rem 0.85rem;
        border-radius: 999px;
        border: 2px solid transparent;
        transition: all 0.2s ease;
      }

      .checkbox-group label:has(input:checked) {
        border-color: var(--accent);
        background: var(--surface-strong);
      }

      .checkbox-group input[type="checkbox"] {
        width: auto;
        cursor: pointer;
      }

      .mode-selector {
        display: flex;
        gap: 1rem;
        margin-bottom: 1.5rem;
        flex-wrap: wrap;
      }

      .mode-selector label {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        cursor: pointer;
        padding: 0.75rem 1.25rem;
        background: var(--surface-soft);
        border-radius: 12px;
        border: 2px solid transparent;
        transition: all 0.2s ease;
      }

      .mode-selector label:has(input:checked) {
        border-color: var(--accent);
        background: var(--surface-strong);
      }

      .mode-selector input {
        cursor: pointer;
      }

      .source-toggle {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 0.5rem;
      }

      .source-toggle button {
        font: inherit;
        font-weight: 600;
        font-size: 0.9rem;
        cursor: pointer;
        border-radius: 8px;
        padding: 0.65rem 0.5rem;
        border: 2px solid var(--surface-strong);
        background: #fff;
        color: var(--ink);
        transition: all 0.2s ease;
        width: 100%;
        line-height: 1.2;
      }

      .source-toggle button.active {
        background: linear-gradient(135deg, var(--accent), var(--accent-dark));
        color: #fff;
        border-color: var(--accent);
        box-shadow: 0 4px 10px rgba(124, 58, 237, 0.25);
      }

      button {
        font: inherit;
        font-weight: 600;
        cursor: pointer;
        border-radius: 999px;
        padding: 0.75rem 2rem;
        border: 1px solid var(--accent);
        background: linear-gradient(135deg, var(--accent), var(--accent-dark));
        color: #fff;
        transition: transform 0.2s ease, box-shadow 0.2s ease;
        width: 100%;
      }

      button:hover:not(:disabled) {
        transform: translateY(-2px);
        box-shadow: 0 10px 22px rgba(124, 58, 237, 0.3);
      }

      button:disabled {
        background: #ddd6fe;
        border-color: #ddd6fe;
        cursor: not-allowed;
      }

      button.secondary {
        background: var(--surface-soft);
        color: var(--ink);
        border-color: var(--surface-strong);
      }

      .card-container {
        perspective: 1000px;
        margin-bottom: 2rem;
      }

      .card {
        width: 100%;
        min-height: 450px;
        position: relative;
        transform-style: preserve-3d;
        transition: transform 0.6s;
        cursor: pointer;
      }

      .card.flipped {
        transform: rotateY(180deg);
      }

      .card-face {
        position: absolute;
        width: 100%;
        min-height: 450px;
        backface-visibility: hidden;
        border-radius: 20px;
        padding: 3rem 2.5rem;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        text-align: center;
        box-shadow: 0 20px 60px rgba(124, 58, 237, 0.25);
      }

      .card-front {
        background: linear-gradient(135deg, var(--accent), var(--accent-dark));
        color: #fff;
      }

      .card-back {
        background: var(--surface);
        color: var(--ink);
        transform: rotateY(180deg);
        border: 2px solid var(--accent);
      }

      .card-meta {
        font-size: 0.9rem;
        opacity: 0.9;
        margin-bottom: 1.5rem;
        font-weight: 600;
      }

      .card-question {
        font-size: clamp(1.4rem, 4vw, 2rem);
        font-weight: 700;
        margin: 0;
        line-height: 1.3;
      }

      .card-answer {
        font-size: clamp(1.2rem, 3.5vw, 1.7rem);
        font-weight: 600;
        margin: 0 0 1.5rem;
        color: var(--accent);
        line-height: 1.3;
      }

      .card-explanation {
        font-size: 1.05rem;
        line-height: 1.6;
        color: var(--ink-soft);
        max-width: 65ch;
      }

      .card-hint {
        font-size: 0.95rem;
        opacity: 0.85;
        margin-top: 2rem;
      }

      .source-tag {
        display: inline-block;
        font-size: 0.72rem;
        font-weight: 700;
        padding: 0.18rem 0.6rem;
        border-radius: 999px;
        margin-left: 0.5rem;
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }

      .source-tag.teacher {
        background: #fbbf24;
        color: #78350f;
      }

      .source-tag.textbook {
        background: #ddd6fe;
        color: #4c1d95;
      }

      .progress {
        text-align: center;
        font-size: 1.1rem;
        font-weight: 600;
        color: var(--ink-soft);
        margin-bottom: 1.5rem;
      }

      .progress span {
        color: var(--accent);
      }

      .navigation {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 1rem;
        margin-bottom: 2rem;
      }

      .navigation button {
        width: 100%;
      }

      .results {
        background: var(--surface);
        border-radius: 20px;
        padding: 3rem 2.5rem;
        box-shadow: 0 20px 60px rgba(124, 58, 237, 0.2);
        text-align: center;
      }

      .results h2 {
        margin: 0 0 1.5rem;
        font-size: 2rem;
      }

      .results p {
        font-size: 1.1rem;
        color: var(--ink-soft);
        margin-bottom: 2rem;
      }

      .error {
        background: #fee2e2;
        border: 1px solid #dc2626;
        color: #dc2626;
        padding: 1.25rem;
        border-radius: 12px;
        margin: 1rem 0;
      }

      .hidden {
        display: none !important;
      }

      .back-link {
        display: block;
        text-align: center;
        margin-top: 1rem;
        color: var(--accent);
        text-decoration: none;
      }

      .back-link:hover {
        text-decoration: underline;
      }

      @media (max-width: 640px) {
        body {
          padding: 0 1rem 2rem;
        }

        header {
          padding: 1.5rem 0 1.25rem;
        }

        .controls {
          padding: 1.25rem 1.5rem;
        }

        .card-face {
          min-height: 380px;
          padding: 2rem 1.5rem;
        }

        .checkbox-group {
          flex-direction: column;
        }

        .checkbox-group label {
          justify-content: flex-start;
        }

        .mode-selector {
          flex-direction: column;
        }

        .navigation {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>Flash Cards - Konec středověku a počátky novověku</h1>
        <p>
          Procvičuj si látku pomocí interaktivních kartiček. Klikni na kartičku pro otočení a zobrazení odpovědi.
        </p>
      </header>

      <div id="error" class="error hidden"></div>

      <div id="setup" class="controls">
        <h3>Vyber režim procvičování</h3>

        <div class="mode-selector">
          <label>
            <input type="radio" name="mode" value="questions" checked />
            Otázky z kvízu
          </label>
          <label>
            <input type="radio" name="mode" value="terminology" />
            Terminologie (pojmy)
          </label>
          <label>
            <input type="radio" name="mode" value="timeline" />
            Časová osa (roky)
          </label>
        </div>

        <div id="sourceFilter" class="filter-group">
          <label>Rozsah učiva:</label>
          <div class="source-toggle">
            <button type="button" id="sourceTeacher" class="active" data-source="ucitelka">Jen od učitelky</button>
            <button type="button" id="sourceAll" data-source="all">Vše včetně učebnice</button>
          </div>
        </div>

        <div id="categoryFilter" class="filter-group hidden">
          <label>Kategorie terminologie:</label>
          <div class="checkbox-group" id="categoryCheckboxes">
            <!-- Dynamically populated -->
          </div>
        </div>

        <button id="startBtn">Začít procvičovat</button>
        <a href="konec-stredoveku-test-mobil.html" class="back-link">Přejít na test</a>
      </div>

      <div id="flashcards" class="hidden">
        <div class="progress" id="progress"></div>

        <div class="card-container">
          <div class="card" id="card">
            <div class="card-face card-front" id="cardFront">
              <!-- Question -->
            </div>
            <div class="card-face card-back" id="cardBack">
              <!-- Answer -->
            </div>
          </div>
        </div>

        <div class="navigation">
          <button id="prevBtn" class="secondary">Předchozí</button>
          <button id="nextBtn">Další</button>
        </div>

        <div style="text-align: center;">
          <button id="finishBtn" class="secondary">Ukončit procvičování</button>
        </div>
      </div>

      <div id="results" class="results hidden">
        <h2>Procvičování dokončeno!</h2>
        <p>Prošla jsi všechny kartičky. Teď už můžeš jít na test!</p>
        <button id="restartBtn">Procvičovat znovu</button>
        <a href="konec-stredoveku-test-mobil.html" class="back-link">
          Jít na test
        </a>
      </div>
    </main>

    <script>
      let data = null;
      let currentCards = [];
      let currentIndex = 0;
      let isFlipped = false;
      let currentMode = 'questions';
      let selectedSource = 'ucitelka';

      const TEACHER_CATEGORIES = ['Mestska_spolecnost', 'Objevne_plavby', 'Jagellonci'];
      const TEXTBOOK_CATEGORIES = ['Humanismus_a_renesance', 'Pozdni_gotika'];

      async function loadData() {
        try {
          const response = await fetch('konec-stredoveku-questions.json');
          if (!response.ok) throw new Error('Failed to load data');
          data = await response.json();
          populateCategoryFilter();
        } catch (error) {
          showError(
            'Nepodařilo se načíst data. Ujisti se, že používáš lokální server (python3 -m http.server).'
          );
          console.error(error);
        }
      }

      function populateCategoryFilter() {
        const container = document.getElementById('categoryCheckboxes');
        container.innerHTML = '';

        if (data && data.terminologie) {
          Object.keys(data.terminologie).forEach(category => {
            const label = document.createElement('label');
            const checkbox = document.createElement('input');
            checkbox.type = 'checkbox';
            checkbox.value = category;
            checkbox.checked = TEACHER_CATEGORIES.includes(category);

            const categoryName = category.replace(/_/g, ' ');
            label.appendChild(checkbox);
            const tag = document.createElement('span');
            tag.className = 'source-tag ' + (TEACHER_CATEGORIES.includes(category) ? 'teacher' : 'textbook');
            tag.textContent = TEACHER_CATEGORIES.includes(category) ? 'U' : 'UČ';
            label.appendChild(document.createTextNode(' ' + categoryName + ' '));
            label.appendChild(tag);
            container.appendChild(label);
          });
        }
      }

      function showError(message) {
        const errorEl = document.getElementById('error');
        errorEl.textContent = message;
        errorEl.classList.remove('hidden');
      }

      function hideError() {
        document.getElementById('error').classList.add('hidden');
      }

      function shuffle(array) {
        const shuffled = [...array];
        for (let i = shuffled.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
        }
        return shuffled;
      }

      function updateFilterVisibility() {
        const mode = document.querySelector('input[name="mode"]:checked').value;
        document.getElementById('categoryFilter').classList.toggle('hidden', mode !== 'terminology');
        document.getElementById('sourceFilter').classList.toggle('hidden', mode === 'timeline' || mode === 'terminology');
      }

      document.querySelectorAll('input[name="mode"]').forEach(radio => {
        radio.addEventListener('change', updateFilterVisibility);
      });

      document.querySelectorAll('.source-toggle button[data-source]').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('.source-toggle button[data-source]').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          selectedSource = btn.dataset.source;
        });
      });

      document.getElementById('startBtn').addEventListener('click', () => {
        hideError();

        if (!data) {
          showError('Nejprve je potřeba načíst data.');
          return;
        }

        currentMode = document.querySelector('input[name="mode"]:checked').value;
        let cards = [];

        if (currentMode === 'questions') {
          let filtered = data.otazky;
          if (selectedSource === 'ucitelka') {
            filtered = filtered.filter(q => q.zdroj_kategorie === 'ucitelka');
          }
          cards = filtered.map(q => ({
            front: q.otazka,
            back: q.spravna_odpoved,
            explanation: q.oduvodneni,
            meta: q.tema + ' · ' + q.obtiznost,
            source: q.zdroj_kategorie
          }));
        } else if (currentMode === 'terminology') {
          const selectedCategories = Array.from(
            document.querySelectorAll('#categoryCheckboxes input:checked')
          ).map(cb => cb.value);

          if (selectedCategories.length === 0) {
            showError('Vyber alespoň jednu kategorii.');
            return;
          }

          selectedCategories.forEach(cat => {
            if (data.terminologie[cat]) {
              const source = TEACHER_CATEGORIES.includes(cat) ? 'ucitelka' : 'ucebnice';
              data.terminologie[cat].forEach(term => {
                cards.push({
                  front: term.pojem,
                  back: term.vysvetleni,
                  explanation: '',
                  meta: cat.replace(/_/g, ' '),
                  source: source
                });
              });
            }
          });
        } else if (currentMode === 'timeline') {
          cards = data.casova_osa.map(event => ({
            front: event.udalost,
            back: String(event.rok),
            explanation: '',
            meta: 'Časová osa',
            source: null
          }));
        }

        if (cards.length === 0) {
          showError('Nebyly nalezeny žádné kartičky.');
          return;
        }

        currentCards = shuffle(cards);
        currentIndex = 0;

        document.getElementById('setup').classList.add('hidden');
        document.getElementById('flashcards').classList.remove('hidden');
        showCard();
      });

      function showCard() {
        if (currentIndex >= currentCards.length) {
          showResults();
          return;
        }

        const cardData = currentCards[currentIndex];
        const card = document.getElementById('card');
        const cardFront = document.getElementById('cardFront');
        const cardBack = document.getElementById('cardBack');

        function updateContent() {
          document.getElementById('progress').innerHTML = `
            Kartička <span>${currentIndex + 1}</span> z <span>${currentCards.length}</span>
          `;

          let sourceTag = '';
          if (cardData.source === 'ucitelka') {
            sourceTag = '<span class="source-tag teacher">Učitelka</span>';
          } else if (cardData.source === 'ucebnice') {
            sourceTag = '<span class="source-tag textbook">Učebnice</span>';
          }

          cardFront.innerHTML = `
            <div class="card-meta">${cardData.meta}${sourceTag}</div>
            <h2 class="card-question">${cardData.front}</h2>
            <div class="card-hint">Klikni pro zobrazení odpovědi</div>
          `;

          let backContent = `
            <div class="card-meta">${cardData.meta}${sourceTag}</div>
            <div class="card-answer">${cardData.back}</div>
          `;
          if (cardData.explanation) {
            backContent += `<div class="card-explanation">${cardData.explanation}</div>`;
          }
          cardBack.innerHTML = backContent;

          document.getElementById('prevBtn').disabled = currentIndex === 0;
          document.getElementById('nextBtn').textContent =
            currentIndex === currentCards.length - 1 ? 'Dokončit' : 'Další';
        }

        if (isFlipped) {
          card.classList.remove('flipped');
          isFlipped = false;
          setTimeout(updateContent, 620);
        } else {
          updateContent();
        }
      }

      document.getElementById('card').addEventListener('click', () => {
        const card = document.getElementById('card');
        card.classList.toggle('flipped');
        isFlipped = !isFlipped;
      });

      document.getElementById('prevBtn').addEventListener('click', () => {
        if (currentIndex > 0) {
          currentIndex--;
          showCard();
        }
      });

      document.getElementById('nextBtn').addEventListener('click', () => {
        if (currentIndex < currentCards.length - 1) {
          currentIndex++;
          showCard();
        } else {
          showResults();
        }
      });

      document.getElementById('finishBtn').addEventListener('click', () => {
        showResults();
      });

      function showResults() {
        document.getElementById('flashcards').classList.add('hidden');
        document.getElementById('results').classList.remove('hidden');
      }

      document.getElementById('restartBtn').addEventListener('click', () => {
        document.getElementById('results').classList.add('hidden');
        document.getElementById('setup').classList.remove('hidden');
      });

      document.addEventListener('keydown', (e) => {
        if (document.getElementById('flashcards').classList.contains('hidden')) {
          return;
        }

        if (e.key === 'ArrowLeft' && currentIndex > 0) {
          currentIndex--;
          showCard();
        } else if (e.key === 'ArrowRight' && currentIndex < currentCards.length - 1) {
          currentIndex++;
          showCard();
        } else if (e.key === ' ' || e.key === 'Enter') {
          e.preventDefault();
          document.getElementById('card').click();
        }
      });

      updateFilterVisibility();
      loadData();
    </script>
  </body>
</html>
