<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cuando se abre en la mañana – naučit se básničku</title>
<link rel="stylesheet" href="basen/trainer.css">
<style>
  :root {
    --bg: linear-gradient(160deg, #7f1d1d 0%, #be123c 45%, #fda4af 100%);
    --accent: #e11d48; --dark: #9f1239; --soft: #fecdd3; --paper: #fff1f2;
  }
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script type="module">
import { startTrainer } from './basen/trainer.js';

// Rose: stanza 1 = 4 inner red petals, stanza 2 = 4 coral petals, stanza 3 = 12 outer white petals,
// following the colour change in the poem.
function drawRose(svg, mastered) {
  const rings = [
    { from: 0, count: 4, r: 12, len: 16, fill: '#be123c', turn: 0 },
    { from: 4, count: 4, r: 22, len: 20, fill: '#fb7185', turn: 45 },
    { from: 8, count: 12, r: 33, len: 18, fill: '#fff1f2', turn: 0 },
  ];
  let out = '';
  for (const ring of rings.slice().reverse()) {
    for (let k = 0; k < ring.count; k++) {
      const on = mastered.has(ring.from + k), a = (360 / ring.count) * k + ring.turn;
      out += `<ellipse cx="0" cy="${-ring.r}" rx="${ring.len * 0.55}" ry="${ring.len * 0.75}" transform="rotate(${a})"
        fill="${on ? ring.fill : 'none'}" stroke="${on ? '#9f1239' : '#fecdd3'}" stroke-width="1.5" stroke-dasharray="${on ? '' : '3 3'}"/>`;
    }
  }
  svg.innerHTML = out + '<circle r="6" fill="#facc15" stroke="#a16207"/>';
}

// Words follow Lorca's original (Doña Rosita la soltera, Act 1). The class handout
// had four slips: "de asoma", "desmala ya", "blanco cuerno", "desalojar".
startTrainer({
  title: 'Cuando se abre en la mañana',
  intro: 'Básnička o růži během jednoho dne: ráno rudá, v poledne tvrdá, večer bílá, v noci opadává. Každý verš, který umíš zpaměti, přidá růži lístek.',
  store: 'es-cuando-se-abre-v1',
  audioDir: 'audio/cuando-se-abre',
  winTitle: 'Celá růže rozkvetla!',
  reward: { label: 'Růže: každý zvládnutý verš přidá jeden lístek', draw: drawRose },
  stanzaNames: ['1. sloka – ráno', '2. sloka – poledne', '3. sloka – večer a noc'],
  stanzas: [
    [
      ['Cuando se abre en la mañana', 'Když se ráno otevře,'],
      ['roja como sangre está;', 'je rudá jako krev;'],
      ['el rocío no la toca', 'rosa se jí nedotkne,'],
      ['porque se teme quemar.', 'protože se bojí, že se spálí.'],
    ],
    [
      ['Abierta en el mediodía', 'Rozvitá v poledne'],
      ['es dura como el coral,', 'je tvrdá jako korál,'],
      ['el sol se asoma a los vidrios', 'slunce nakukuje do oken,'],
      ['para verla relumbrar.', 'aby ji vidělo zářit.'],
    ],
    [
      ['Cuando en las ramas empiezan', 'Když ve větvích začnou'],
      ['los pájaros a cantar', 'ptáci zpívat'],
      ['y se desmaya la tarde', 'a podvečer omdlévá'],
      ['en las violetas del mar,', 've fialkách moře,'],
      ['se pone blanca, con blanco', 'zbělá, bělobou'],
      ['de una mejilla de sal;', 'solné tváře;'],
      ['y cuando toca la noche', 'a když noc zatroubí'],
      ['blando cuerno de metal', 'na měkký kovový roh'],
      ['y las estrellas avanzan', 'a hvězdy postupují,'],
      ['mientras los aires se van,', 'zatímco větry odcházejí,'],
      ['en la raya de lo oscuro', 'na hranici tmy'],
      ['se comienza a deshojar.', 'začne opadávat.'],
    ],
  ],
});
</script>
</body>
</html>
